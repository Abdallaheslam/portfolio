    <!-- Pre-paint theme and language initialization -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('portfolio-theme');
          var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#060A13' : '#F8FAFC');
          }
          var savedLang = localStorage.getItem('portfolio-lang');
          var lang = savedLang === 'ar' || savedLang === 'en' ? savedLang : 'en';
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
